en:
  page_title: Media library
  page_description: "A media library to upload, browse and pick images and files, usable as a full page or opened as a picker in a modal or a side panel."
  page_icon: ph:bold/images
  open:
    modal: Open in a modal
    panel: Open in a panel

fr:
  page_title: Médiathèque
  page_description: "Une médiathèque pour téléverser, parcourir et choisir images et fichiers, utilisable en pleine page ou ouverte comme sélecteur dans une modale ou un panneau latéral."
  page_icon: ph:bold/images
  open:
    modal: Ouvrir dans une modale
    panel: Ouvrir dans un panneau

zh:
  page_title: 媒体库
  page_description: "用于上传、浏览和选择图片与文件的媒体库，可作为整页使用，也可在模态框或侧边面板中作为选择器打开。"
  page_icon: 'ph:bold/images'
  open:
    modal: 在弹窗中打开
    panel: 在面板中打开

ar:
  page_title: 'مكتبة الوسائط'
  page_description: "مكتبة وسائط لرفع الصور والملفات وتصفحها واختيارها، تُستخدم كصفحة كاملة أو تُفتح كأداة اختيار في نافذة منبثقة أو لوحة جانبية."
  page_icon: 'ph:bold/images'
  open:
    modal: 'افتح في نافذة منبثقة'
    panel: 'افتح في لوحة'

hi:
  page_title: 'मीडिया पुस्तकालय'
  page_description: "चित्र और फ़ाइलें अपलोड करने, देखने और चुनने के लिए मीडिया लाइब्रेरी, पूरे पेज के रूप में या मोडल या साइड पैनल में पिकर के रूप में।"
  page_icon: 'ph:bold/images'
  open:
    modal: 'मोडल में खोलें'
    panel: 'पैनल में खोलें'

he:
  page_title: 'ספריית מדיה'
  page_description: "ספריית מדיה להעלאה, עיון ובחירה של תמונות וקבצים, כעמוד מלא או כבורר שנפתח בחלון מודאלי או בלוח צד."
  page_icon: 'ph:bold/images'
  open:
    modal: 'פתח במודל'
    panel: 'פתח בלוח'

fa:
  page_title: 'کتابخانه رسانه'
  page_description: "کتابخانه رسانه برای بارگذاری، مرور و انتخاب تصویرها و فایل‌ها، به‌صورت صفحه کامل یا به شکل انتخابگر در مودال یا پنل کناری."
  page_icon: 'ph:bold/images'
  open:
    modal: 'باز کردن در یک پنجره مدال'
    panel: 'باز کردن در یک پنل'

ur:
  page_title: 'میڈیا لائبریری'
  page_description: "تصاویر اور فائلیں اپ لوڈ کرنے، دیکھنے اور چننے کے لیے میڈیا لائبریری، پورے صفحے کے طور پر یا موڈل یا سائیڈ پینل میں انتخاب کار کے طور پر۔"
  page_icon: 'ph:bold/images'
  open:
    modal: 'ماڈل میں کھولیں'
    panel: 'پینل میں کھولیں'

ja:
  page_title: メディアライブラリ
  page_description: "画像やファイルをアップロード、閲覧、選択できるメディアライブラリ。全画面でも、モーダルやサイドパネルのピッカーとしても使えます。"
  page_icon: 'ph:bold/images'
  open:
    modal: モーダルで開く
    panel: パネルで開く

ko:
  page_title: '미디어 라이브러리'
  page_description: "이미지와 파일을 업로드하고 둘러보고 선택하는 미디어 라이브러리. 전체 페이지로, 또는 모달이나 사이드 패널의 선택기로 사용합니다."
  page_icon: 'ph:bold/images'
  open:
    modal: '모달에서 열기'
    panel: '패널에서 열기'

bn:
  page_title: 'মিডিয়া লাইব্রেরি'
  page_description: "ছবি ও ফাইল আপলোড, ব্রাউজ ও বাছাই করার মিডিয়া লাইব্রেরি, পূর্ণ পেজ হিসেবে বা মোডাল বা পার্শ্ব প্যানেলে পিকার হিসেবে।"
  page_icon: 'ph:bold/images'
  open:
    modal: 'মোডালে খুলুন'
    panel: 'প্যানেলে খুলুন'

th:
  page_title: คลังสื่อ
  page_description: "คลังสื่อสำหรับอัปโหลด เรียกดู และเลือกรูปภาพและไฟล์ ใช้เป็นหน้าเต็มหรือเปิดเป็นตัวเลือกในโมดัลหรือแผงด้านข้าง"
  page_icon: 'ph:bold/images'
  open:
    modal: เปิดในโมดัล
    panel: เปิดในแผง

de:
  page_title: Medienbibliothek
  page_description: "Eine Mediathek zum Hochladen, Durchsuchen und Auswählen von Bildern und Dateien, als ganze Seite oder als Auswahl in einem Modal oder Seitenpanel."
  page_icon: 'ph:bold/images'
  open:
    modal: 'In einem Modal öffnen'
    panel: 'In einem Panel öffnen'

fi:
  page_title: Mediakirjasto
  page_description: "Mediakirjasto kuvien ja tiedostojen lataamiseen, selaamiseen ja valitsemiseen, koko sivuna tai valitsimena modaalissa tai sivupaneelissa."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Avaa muokkausikkunassa'
    panel: 'Avaa paneelissa'

ru:
  page_title: 'Медиа библиотека'
  page_description: "Медиатека для загрузки, просмотра и выбора изображений и файлов — на всю страницу или как средство выбора в модальном окне или боковой панели."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Открыть в модальном окне'
    panel: 'Открыть в панели'

pl:
  page_title: 'Biblioteka multimediów'
  page_description: "Biblioteka mediów do wgrywania, przeglądania i wybierania obrazów oraz plików, jako pełna strona lub selektor w oknie modalnym albo panelu bocznym."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Otwórz w oknie modalnym'
    panel: 'Otwórz w panelu'

es:
  page_title: 'Biblioteca de medios'
  page_description: "Una mediateca para subir, explorar y elegir imágenes y archivos, como página completa o abierta como selector en un modal o un panel lateral."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Abrir en un modal'
    panel: 'Abrir en un panel'

it:
  page_title: 'Libreria multimediale'
  page_description: "Una libreria multimediale per caricare, sfogliare e scegliere immagini e file, a pagina intera o aperta come selettore in un modale o pannello laterale."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Apri in un modale'
    panel: 'Apri in un pannello'

pt_BR:
  page_title: 'Biblioteca de mídia'
  page_description: "Uma biblioteca de mídia para enviar, navegar e escolher imagens e arquivos, em página inteira ou aberta como seletor num modal ou painel lateral."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Abrir em um modal'
    panel: 'Abrir em um painel'

tr:
  page_title: 'Medya kütüphanesi'
  page_description: "Görsel ve dosya yüklemek, göz atmak ve seçmek için bir medya kütüphanesi; tam sayfa ya da modal veya yan panelde seçici olarak kullanılır."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Modalde aç'
    panel: 'Panelde aç'

vi:
  page_title: 'Thư viện phương tiện'
  page_description: "Thư viện phương tiện để tải lên, duyệt và chọn hình ảnh, tệp, dùng dạng toàn trang hoặc mở làm bộ chọn trong modal hay bảng bên."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Mở trong một hộp thoại'
    panel: 'Mở trong một bảng'

id:
  page_title: 'Perpustakaan media'
  page_description: "Pustaka media untuk mengunggah, menelusuri, dan memilih gambar serta berkas, sebagai halaman penuh atau pemilih dalam modal atau panel samping."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Buka dalam modal'
    panel: 'Buka dalam panel'

nl:
  page_title: Mediabibliotheek
  page_description: "Een mediabibliotheek om afbeeldingen en bestanden te uploaden, door te bladeren en te kiezen, als volledige pagina of als kiezer in een modal of zijpaneel."
  page_icon: 'ph:bold/images'
  open:
    modal: 'Open in een popup'
    panel: 'Open in een paneel'
